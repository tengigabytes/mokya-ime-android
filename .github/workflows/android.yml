name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-host-tests:
    name: Engine host tests (JNI on the JVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test :mie-engine
        run: ./gradlew :mie-engine:test --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mie-engine-test-report
          path: mie-engine/build/reports/tests/test

  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Third-party dictionary sources downloaded by generateMieDict.
      - uses: actions/cache@v4
        with:
          path: .mie-data
          key: mie-data-${{ hashFiles('app/src/main/cpp/libmie/tools/fetch_data.py') }}

      - name: Build
        run: ./gradlew :app:assembleDebug --stacktrace

      # The APK is not uploaded: it bundles the generated dictionary, whose
      # third-party data notices are not packaged yet (see README).
      - name: Check APK contents
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -v "$apk" | grep -E 'assets/dict_mie_v4.bin|lib/.*/libmokyaime_jni.so'
          unzip -v "$apk" assets/dict_mie_v4.bin | grep -q ' Stored ' \
            || { echo "::error::dict_mie_v4.bin must be stored uncompressed"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" "lib/$abi/libmokyaime_jni.so" > /dev/null \
              || { echo "::error::missing lib/$abi/libmokyaime_jni.so"; exit 1; }
          done
