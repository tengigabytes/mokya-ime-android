name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-host-tests:
    name: Engine host tests (JNI on the JVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test :mie-engine
        run: ./gradlew :mie-engine:test --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mie-engine-test-report
          path: mie-engine/build/reports/tests/test

  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Third-party dictionary sources downloaded by generateMieDict.
      - uses: actions/cache@v4
        with:
          path: .mie-data
          key: mie-data-${{ hashFiles('app/src/main/cpp/libmie/tools/fetch_data.py') }}

      - name: Build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Check APK contents
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -v "$apk" | grep -E 'assets/dict_mie_v4.bin|lib/.*/libmokyaime_jni.so'
          unzip -v "$apk" assets/dict_mie_v4.bin | grep -q ' Stored ' \
            || { echo "::error::dict_mie_v4.bin must be stored uncompressed"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" "lib/$abi/libmokyaime_jni.so" > /dev/null \
              || { echo "::error::missing lib/$abi/libmokyaime_jni.so"; exit 1; }
          done
          for f in NOTICE Apache-2.0.txt libmie-MIT.txt LGPL-2.1.txt CC-BY-SA-4.0.txt; do
            unzip -l "$apk" "assets/licenses/$f" > /dev/null \
              || { echo "::error::missing assets/licenses/$f"; exit 1; }
          done

  emulator-tests:
    name: End-to-end tests (emulator, API 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: .mie-data
          key: mie-data-${{ hashFiles('app/src/main/cpp/libmie/tools/fetch_data.py') }}

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests/connected
